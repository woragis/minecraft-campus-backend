name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Go test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: campus
          POSTGRES_DB: campusworld
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campus -d campusworld"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://campus:campus@localhost:5432/campusworld?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Test
        run: go test ./... -count=1

      - name: Build
        run: go build ./...
